{% extends "base.html" %}

{% block content %}
<div style="max-width: 1200px; margin: 0 auto; padding: 6rem 2rem; background: var(--paper);">
    <h1 class="syne" style="font-size: 42px; color: var(--ink); font-weight: 800; margin-bottom: 3rem; border-bottom: 1px solid var(--cream); padding-bottom: 1.5rem;">
        Finalizar <em style="color: var(--accent); font-family: 'Cormorant Garamond', serif; font-weight: 400;">Pedido</em>
    </h1>

    <form action="{{ url_for('procesar_pago') }}" method="POST" style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 4rem;">
        <input type="hidden" name="total_final" value="{{ total }}">
        
        <div style="display: flex; flex-direction: column; gap: 2.5rem; background: white; padding: 3rem; border: 1px solid var(--cream);">
            <div>
                <h3 class="syne" style="font-size: 22px; font-weight: 700; margin: 0 0 1.5rem 0;">1. Detalles de Envío</h3>
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label class="mono" style="font-size: 11px; color: var(--warm-mid);">CALLE *</label>
                        <input type="text" name="calle" required style="padding: 0.8rem; border: 1px solid var(--cream);">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label class="mono" style="font-size: 11px; color: var(--warm-mid);">NÚMERO *</label>
                        <input type="text" name="numero" required style="padding: 0.8rem; border: 1px solid var(--cream);">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label class="mono" style="font-size: 11px; color: var(--warm-mid);">COLONIA *</label>
                        <input type="text" name="colonia" required style="padding: 0.8rem; border: 1px solid var(--cream);">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label class="mono" style="font-size: 11px; color: var(--warm-mid);">CÓDIGO POSTAL *</label>
                        <input type="text" name="cp" required maxlength="5" style="padding: 0.8rem; border: 1px solid var(--cream);">
                    </div>
                </div>
            </div>

            <div style="border-top: 1px solid var(--cream); padding-top: 2rem;">
                <h3 class="syne" style="font-size: 22px; font-weight: 700; margin: 0 0 1.5rem 0;">2. Método de Pago</h3>
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    <label style="display: flex; align-items: center; gap: 1rem; border: 1px solid var(--cream); padding: 1.2rem; cursor: pointer;">
                        <input type="radio" name="metodo_pago" value="Tarjeta Bancaria" checked> 💳 Tarjeta Bancaria
                    </label>
                    <label style="display: flex; align-items: center; gap: 1rem; border: 1px solid var(--cream); padding: 1.2rem; cursor: pointer;">
                        <input type="radio" name="metodo_pago" value="Efectivo"> 💵 Pago en Efectivo contra entrega
                    </label>
                </div>
            </div>
        </div>

        <div style="background: var(--white); border: 1px solid var(--cream); padding: 3rem; display: flex; flex-direction: column; justify-content: space-between; max-height: 450px;">
            <div>
                <h3 class="syne" style="font-size: 20px; font-weight: 700; margin: 0 0 1.5rem 0;">Resumen</h3>
                <div style="display: flex; flex-direction: column; gap: 1rem; max-height: 150px; overflow-y: auto; margin-bottom: 1.5rem;">
                    {% for p in productos %}
                        <div style="display: flex; justify-content: space-between; font-size: 13px;" class="mono">
                            <span style="color: var(--warm-mid);">{{ p.nombre }}</span>
                            <span>${{ p.precio }}</span>
                        </div>
                    {% endfor %}
                </div>
                <div style="border-top: 1px solid var(--cream); padding-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem;" class="mono">
                    <div style="display: flex; justify-content: space-between;"><span>Subtotal:</span><span>${{ subtotal }}</span></div>
                    <div style="display: flex; justify-content: space-between; color: var(--accent);"><span>Envío Ecológico:</span><span>${{ envio }}</span></div>
                </div>
            </div>
            <div style="border-top: 1px solid var(--ink); padding-top: 1.5rem;">
                <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2rem;">
                    <span class="mono" style="font-size: 12px;">Total Final:</span>
                    <span class="syne" style="font-size: 36px; font-weight: 800;">${{ total }}</span>
                </div>
                <button type="submit" style="width: 100%; background: var(--accent); color: white; border: none; padding: 1.2rem; font-family: 'DM Mono'; font-size: 12px; text-transform: uppercase; cursor: pointer; font-weight: 600;">
                    Confirmar y Pagar
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
