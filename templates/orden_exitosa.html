{% extends "base.html" %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto; padding: 8rem 2rem; text-align: center; background: var(--paper);">
    <div style="width: 80px; height: 80px; background: white; border: 1px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 40px; border-radius: 50%; margin: 0 auto 2rem auto;">✓</div>
    <span class="mono" style="color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em;">Transacción Completada</span>
    <h1 class="syne" style="font-size: 44px; color: var(--ink); margin: 0.5rem 0 1rem 0; font-weight: 800;">
        ¡Pedido Recibido con <em style="color: var(--accent); font-family: 'Cormorant Garamond', serif; font-weight: 400;">Éxito</em>!
    </h1>
    <p style="font-family: 'Cormorant Garamond', serif; color: var(--warm-mid); font-size: 22px; max-width: 550px; margin: 0 auto 3rem auto; line-height: 1.5;">
        Tu pago ha sido procesado de manera segura. Nuestro camión de Refill Go ya está programando la ruta de relleno directo a tu domicilio en Aguascalientes.
    </p>
    <a href="{{ url_for('index') }}" class="mono" style="display: inline-block; background: var(--ink); color: white; text-decoration: none; padding: 1rem 3rem; font-size: 12px; text-transform: uppercase; font-weight: 600;">Volver al Inicio</a>
</div>
{% endblock %}
