{% extends "base.html" %}
{% block content %}

<div style="position: relative; width: 100%; height: 60vh; overflow: hidden; display: flex; align-items: center; justify-content: center;">
    <video autoplay muted loop playsinline style="position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; width: auto; height: auto; z-index: 1; transform: translate(-50%, -50%); object-fit: cover;">
        <source src="/static/naturaleza.mp4" type="video/mp4">
    </video>
    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 2;"></div>
    
    <div style="position: relative; z-index: 3; text-align: center; color: white; padding: 0 1rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem;">
        <h1 class="syne" style="font-size: 3.5rem; margin: 0; font-weight: 700; letter-spacing: -1px; text-shadow: 2px 2px 8px rgba(0,0,0,0.6);">Suministro Circular Sostenible</h1>
        <p style="font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-style: italic; margin: 0; max-width: 650px; text-shadow: 1px 1px 4px rgba(0,0,0,0.6);">
            Reutiliza tus envases, reduce residuos y paga solo por el líquido que necesitas.
        </p>
        <a href="{{ url_for('planes') }}" class="mono" style="display: inline-block; background: #2e7d32; color: #ffffff; text-decoration: none; padding: 0.8rem 2rem; font-size: 0.8rem; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            Conocer Planes de Recarga
        </a>
    </div>
</div>

<div style="max-width: 1300px; margin: 0 auto; padding: 5rem 2rem; background: var(--paper);">
    <div style="display: flex; gap: 1.5rem; justify-content: center; margin-bottom: 4rem; flex-wrap: wrap;" class="mono">
        <button onclick="filtrarCategoria('todos')" style="background: #000000; color: white; border: none; padding: 0.6rem 1.8rem; font-size: 0.8rem; cursor: pointer; text-transform: uppercase;">TODOS</button>
        <button onclick="filtrarCategoria('Limpieza')" style="background: white; color: var(--ink); border: 1px solid var(--cream); padding: 0.6rem 1.8rem; font-size: 0.8rem; cursor: pointer; text-transform: uppercase;">LIMPIEZA GENERAL</button>
        <button onclick="filtrarCategoria('Ropa')" style="background: white; color: var(--ink); border: 1px solid var(--cream); padding: 0.6rem 1.8rem; font-size: 0.8rem; cursor: pointer; text-transform: uppercase;">ROPA</button>
    </div>

    <div id="grid-productos" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2.5rem;"></div>
</div>

<script>
    let productos = [];
    try { productos = JSON.parse('{{ productos_json | safe }}'); } catch (e) { console.error(e); }

    function renderizarProductos(lista) {
        const grid = document.getElementById('grid-productos');
        grid.innerHTML = '';
        if (!lista || lista.length === 0) {
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 5rem;" class="mono">No se encontraron productos.</div>';
            return;
        }
        lista.forEach(p => {
            const card = document.createElement('div');
            card.style.cssText = "background: white; border: 1px solid var(--cream); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;";
            card.innerHTML = `
                <div style="background: var(--paper); padding: 2rem; display: flex; align-items: center; justify-content: center; height: 260px;">
                    <img src="/static/img/${p.imagen}" alt="${p.nombre}" style="max-width: 100%; max-height: 100%; object-fit: contain;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <span class="mono" style="font-size: 10px; color: var(--warm-mid); text-transform: uppercase;">${p.categoria}</span>
                    <h4 class="syne" style="font-size: 18px; margin: 0; font-weight: 700; color: var(--ink);">${p.nombre}</h4>
                    <p style="font-family: 'Cormorant Garamond', serif; font-size: 14px; color: #555555; margin: 0; line-height: 1.4;">${p.descripcion}</p>
                    <span class="syne" style="font-size: 16px; font-weight: 700; color: var(--ink); margin-top: 0.5rem;">$${p.precio.toFixed(2)} MXN / L</span>
                </div>
                <div style="margin-top: auto; display: flex; flex-direction: column; gap: 0.5rem;">
                    <span class="mono" style="font-size: 11px; color: #666666;">Disponibles: <strong>${p.stock} L</strong></span>
                    <form action="/procesar_pago" method="POST" style="margin: 0;">
                        <input type="hidden" name="total_final" value="${p.precio}">
                        <button type="submit" class="mono" style="width: 100%; background: var(--ink); color: white; border: none; padding: 0.8rem; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; cursor: pointer;">
                            Agregar al Carrito
                        </button>
                    </form>
                </div>`;
            grid.appendChild(card);
        });
    }

    function filtrarCategoria(cat) {
        if (cat === 'todos') { renderizarProductos(productos); } 
        else { renderizarProductos(productos.filter(p => p.categoria.toLowerCase().includes(cat.toLowerCase()))); }
    }
    document.addEventListener("DOMContentLoaded", () => renderizarProductos(productos));
</script>
{% endblock %}
